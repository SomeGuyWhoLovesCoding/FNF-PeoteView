# This is a workflow to help make ndll production for linux easier than ever before via Actions

name: Ship NDLLS


# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ official ]
  pull_request:
    branches: [ official ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  NDLLWindows:
    runs-on: windows-latest

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4.1.6

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.6
      # Runs a set of commands using the runners shell
      - name: Install required haxelibs
        run: |
          haxelib setup ~/haxelib
          haxelib git lime https://github.com/SomeGuyWhoLovesCoding/lime.git --quiet
          haxelib install format --quiet
          haxelib install hxp --quiet
          haxelib install hxcpp --quiet
      - name: Make NDLL
        run: |
          echo "--HAXELIB PATH:--"
          haxelib libpath lime
          echo "-----------------"
          haxelib run lime setup --quiet
      - name: Publish artifact
        uses: actions/upload-artifact@v4.3.3
        with:
          name: 'NDLL-Windows'
          run: |
            cd "C:/Users/runneradmin/"
          path: haxelib/lime/git/ndlls/Windows64
  NDLLLinux:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4.1.6

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.6
      # Runs a set of commands using the runners 
      # fucking hidden dependencies at the start of `run`
      - name: Install required Linux libraries
        run: |
          sudo apt-get install libc6-dev-i386
          export LIBRARY_PATH=/usr/lib/$(gcc -print-multiarch)
          export C_INCLUDE_PATH=/usr/include/$(gcc -print-multiarch)
          export CPLUS_INCLUDE_PATH=/usr/include/$(gcc -print-multiarch)
          sudo apt-get install g++-multilib
          sudo apt install libx11-dev
          sudo apt install libxrandr-dev
          sudo apt-get install libxinerama-dev
          sudo apt-get install libgl1-mesa-dev
          sudo apt-get install libasound2-dev
      - name: Install required haxelibs
        run: |
          haxelib setup ~/haxelib
          haxelib git lime https://github.com/SomeGuyWhoLovesCoding/lime.git --quiet
          haxelib install format --quiet
          haxelib install hxp --quiet
          haxelib install hxcpp --quiet
      - name: Make NDLL
        run: |
          echo "--HAXELIB PATH:--"
          haxelib libpath lime
          echo "-----------------"
          haxelib run lime setup --quiet
      - name: Publish artifact
        uses: actions/upload-artifact@v4.3.3
        with:
          name: 'NDLL-Linux'
          run: |
            cd ~/home/runner/
          path: haxelib/lime/git/ndlls/Linux64
