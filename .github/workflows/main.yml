# This is a workflow to help you get started with Actions

name: Build

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ official ]
  pull_request:
    branches: [ official ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  BuildMatrix:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        include:
          - os: windows-latest
            artifact_name: FV-Windows
            artifact_path: bin/windows/bin
            haxelib_path: C:/haxelib
            compile_target: windows
            needs_tar: false
            
          - os: ubuntu-latest
            artifact_name: FV-Linux
            artifact_path: FV-Linux.tar.gz
            haxelib_path: ~/haxelib
            compile_target: linux
            needs_tar: true
      fail-fast: false  # Don't cancel all builds if one fails
      
    runs-on: ${{ matrix.os }}
    
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v5.0.0
      
      # Cache haxelib dependencies for faster subsequent runs
      - name: Cache haxelib dependencies
        uses: actions/cache@v3
        with:
          path: ${{ matrix.haxelib_path }}
          key: ${{ runner.os }}-haxelib-${{ hashFiles('**/*.hxml', '**/haxelib.json', '**/lime.xml') }}
          restore-keys: |
            ${{ runner.os }}-haxelib-
      
      # Setup Haxe
      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.6
      
      # Install Linux system dependencies (only for Linux)
      - name: Install required Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' /etc/apt/sources.list
          sudo apt-get update
          sudo apt-get install -y libc6-dev-i386
          export LIBRARY_PATH=/usr/lib/$(gcc -print-multiarch)
          export C_INCLUDE_PATH=/usr/include/$(gcc -print-multiarch)
          export CPLUS_INCLUDE_PATH=/usr/include/$(gcc -print-multiarch)
          sudo apt-get install -y g++-multilib
          sudo apt install -y libx11-dev libxrandr-dev libxinerama-dev
          sudo apt-get install -y libgl-dev libgl1-mesa-dev libasound2-dev
          sudo apt-get install -y libdrm-dev libgbm-dev mesa-common-dev libegl1-mesa-dev libgles2-mesa-dev
          sudo dpkg --add-architecture i386
          sudo apt update
          sudo apt-get install -y libgl-dev:i386 libgl1-mesa-dev:i386 libglu1-mesa-dev:i386
          sudo apt-get install -y libdrm-dev:i386 libgbm-dev:i386 mesa-common-dev:i386 libegl1-mesa-dev:i386 libgles2-mesa-dev:i386
          sudo sed -i 's|<drm_mode.h>|<libdrm/drm_mode.h>|' /usr/include/xf86drmMode.h && \
          sudo sed -i 's|<drm.h>|<libdrm/drm.h>|' /usr/include/xf86drm.h && \
          sudo ln -sf /usr/include/libdrm/drm_mode.h /usr/include/drm_mode.h && \
          sudo ln -sf /usr/include/libdrm/drm.h /usr/include/drm.h
      
      # Setup haxelib directory (Windows)
      - name: Setup haxelib (Windows)
        if: runner.os == 'Windows'
        run: haxelib setup C:/haxelib
        shell: cmd
      
      # Setup haxelib directory (Linux)
      - name: Setup haxelib (Linux)
        if: runner.os == 'Linux'
        run: haxelib setup ~/haxelib
        shell: bash
      
      # Install haxelib dependencies (Windows)
      - name: Install haxelib dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          haxelib install format --quiet
          haxelib install hxp --quiet
          haxelib git hxcpp https://github.com/SomeGuyWhoLovesCoding/hxcpp-sgwlfnf.git --quiet
          cd C:/haxelib/hxcpp/git/tools/hxcpp && haxe compile.hxml
          haxelib git lime https://github.com/SomeGuyWhoLovesCoding/lime.git --quiet
          haxelib git peote-view_funkinview https://github.com/SomeGuyWhoLovesCoding/peote-view.git --quiet
          haxelib git linc_luajit_funkinview https://github.com/SomeGuyWhoLovesCoding/linc_luajit_funkinview.git --quiet
          haxelib install input2action --quiet
          haxelib git customtitlebar https://github.com/SomeGuyWhoLovesCoding/customtitlebar.git --quiet
        shell: cmd
      
      # Install haxelib dependencies (Linux)
      - name: Install haxelib dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          haxelib install format --quiet
          haxelib install hxp --quiet
          haxelib git hxcpp https://github.com/SomeGuyWhoLovesCoding/hxcpp-sgwlfnf.git --quiet
          cd ~/haxelib/hxcpp/git/tools/hxcpp && haxe compile.hxml
          haxelib git lime https://github.com/SomeGuyWhoLovesCoding/lime.git --quiet
          haxelib git peote-view_funkinview https://github.com/SomeGuyWhoLovesCoding/peote-view.git --quiet
          haxelib git linc_luajit_funkinview https://github.com/SomeGuyWhoLovesCoding/linc_luajit_funkinview.git --quiet
          haxelib install input2action --quiet
          haxelib git customtitlebar https://github.com/SomeGuyWhoLovesCoding/customtitlebar.git --quiet
        shell: bash
      
      # Check version tag
      - name: Check version tag
        run: echo "${{github.run_id}}" > VERSION
        shell: bash
      
      # Compile for Windows
      - name: Compile (Windows)
        if: runner.os == 'Windows'
        run: haxelib run lime build windows --app-version="4.0.0-${{ github.run_id}}"
        shell: cmd
      
      # Compile for Linux
      - name: Compile (Linux)
        if: runner.os == 'Linux'
        run: |
          haxelib run lime rebuild linux
          haxelib run lime build linux --app-version="4.0.0-${{ github.run_id}}"
        shell: bash
      
      # Package Linux build
      - name: Package Linux build
        if: matrix.needs_tar == true
        run: |
          mkdir -p export
          cp -r bin/linux/bin/* export/
          cd export && tar -czvf ../${{ matrix.artifact_name }} *
        shell: bash
      
      # Publish artifact
      - name: Publish artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error