# This is a workflow to help you get started with Actions

name: Build

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ official ]
  pull_request:
    branches: [ official ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  BuildMatrix:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        include:
          - os: windows-latest
            artifact_name: FV-Windows
            artifact_path: bin/windows/bin
            haxelib_path: C:/haxelib
            compile_target: windows
            needs_tar: false
            
          - os: ubuntu-latest
            artifact_name: FV-Linux
            artifact_path: FV-Linux.tar.gz
            haxelib_path: ~/haxelib
            compile_target: linux
            needs_tar: true
      fail-fast: false  # Don't cancel all builds if one fails
      
    runs-on: ${{ matrix.os }}
    
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v5.0.0
      
      # Cache haxelib dependencies for faster subsequent runs
      - name: Cache haxelib dependencies
        uses: actions/cache@v5.0.5
        with:
          path: ${{ matrix.haxelib_path }}
          key: ${{ runner.os }}-haxelib-${{ hashFiles('**/*.hxml', '**/haxelib.json', '**/lime.xml') }}
          restore-keys: |
            ${{ runner.os }}-haxelib-
      
      # Setup Haxe
      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.6
      
      # Install Linux system dependencies (only for Linux)
      - name: Install required Linux libraries
        if: runner.os == 'Linux'
        run: |
          bash ./setup/linux.bash
        shell: bash
      
      # Setup haxelib directory (Windows)
      - name: Setup haxelib (Windows)
        if: runner.os == 'Windows'
        run: haxelib setup C:/haxelib
        shell: cmd
      
      # Install haxelib dependencies (Windows)
      - name: Install haxelib dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          # Install hxcpp and lime sequentially
          haxelib git hxcpp https://github.com/SomeGuyWhoLovesCoding/hxcpp-sgwlfnf.git --quiet
          cd C:/haxelib/hxcpp/git/tools/hxcpp && haxe compile.hxml
          haxelib git lime https://github.com/SomeGuyWhoLovesCoding/lime.git --quiet
          
          # Everything else in parallel
          start /B haxelib install format --quiet
          start /B haxelib install hxp --quiet
          start /B haxelib git peote-view_funkinview https://github.com/SomeGuyWhoLovesCoding/peote-view.git --quiet
          start /B haxelib git linc_luajit_funkinview https://github.com/SomeGuyWhoLovesCoding/linc_luajit_funkinview.git --quiet
          start /B haxelib install input2action --quiet
          start /B haxelib git customtitlebar https://github.com/SomeGuyWhoLovesCoding/customtitlebar.git --quiet
          
          # Wait using PowerShell
          powershell -Command "Get-Process haxelib -ErrorAction SilentlyContinue | Wait-Process"
        shell: cmd
      
      # Check version tag
      - name: Check version tag
        run: echo "${{github.run_id}}" > VERSION
        shell: bash
      
      # Compile for Windows
      - name: Compile (Windows)
        if: runner.os == 'Windows'
        run: haxelib run lime build windows --app-version="4.0.0-${{ github.run_id}}"
        shell: cmd
      
      # Compile for Linux
      - name: Compile (Linux)
        if: runner.os == 'Linux'
        run: |
          haxelib run lime rebuild linux
          haxelib run lime build linux --app-version="4.0.0-${{ github.run_id}}"
        shell: bash
      
      # Package Linux build
      - name: Package Linux build
        if: matrix.needs_tar == true
        run: |
          tar -czvf ${{ github.workspace }}/${{ matrix.artifact_name }}.tar.gz -C bin/linux/bin .
          echo "TAR_PATH=${{ github.workspace }}/${{ matrix.artifact_name }}.tar.gz" >> $GITHUB_ENV
        shell: bash

      # Publish artifact
      - name: Publish artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ env.TAR_PATH }}
          if-no-files-found: error